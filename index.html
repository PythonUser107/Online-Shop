<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="./public/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./src/assets/style.css">
  <title>Online-Shop</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <header>
    <div class="header-start">
      <img id="logo" src="./public/logo.svg" alt="Logo">
      <h1>Online-Shop</h1>
    </div>
    <div class="header-end">
      <div class="search-wrapper">
        <img src="./public/search.svg" alt="search">
        <input type="search" placeholder="Search products ..." maxlength="70">
      </div>
      <div class="header-filter-btns">
        <button>
            <img src="./public/like.svg" alt="">
        </button>
        <button>
          <img src="./public/basket.svg" alt="">
        </button>
      </div>
    </div>
  </header>
  <main>
    <div class="main-start">
      <h1>Products</h1>
      <div class="main-filter-btns">
        <button id="filter-btn-all">All</button>
        <button>Electronics</button>
        <button>Accessories</button>
        <button>Clothing</button>
        <button>Home</button>
      </div>
    </div>
    <div class="main-cards"></div>
  </main>
  <footer>
    <div>© 2026 Online-Shop. All rights reserved.</div>
  </footer>
  <script type="module" src="/src/assets/main.ts"></script>
</body>

</html>
